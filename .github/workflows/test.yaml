name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/workflows/test.yaml
      - name: Install test dependencies
        run: pip install pytest-homeassistant
      - name: Run tests
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          pytest 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
