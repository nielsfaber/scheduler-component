name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/workflows/test.yaml
      - name: Install test dependencies
        run: pip install pytest-homeassistant
      - name: Run tests
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          pytest 2>&1 | tee /tmp/pytest.log | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Report failing tests as annotation
        if: failure()
        run: |
          summary="$(grep -E "^(FAILED|ERROR) " /tmp/pytest.log | head -n 10)"
          if [ -z "$summary" ]; then summary="$(tail -n 30 /tmp/pytest.log)"; fi
          echo "::error title=pytest::$(echo "$summary" | tr "
" "|" | head -c 3500)"
